<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employees · DockCare</title>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="page" hidden>
  <div class="card">
    <div class="card-body d-flex flex-wrap gap-2 border-bottom">
      <input class="form-control" style="max-width:320px" id="q" placeholder="Search code or name">
      <select class="form-select" style="max-width:240px" id="dept"><option value="">All departments</option></select>
      <select class="form-select" style="max-width:160px" id="status"><option value="active">Active</option><option value="">All</option><option value="left">Left</option></select>
      <button class="btn btn-light border ms-auto" id="exportBtn"><i class="bi bi-file-earmark-excel me-1"></i>Export to Excel</button>
    </div>
    <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Code</th><th>Name</th><th>Designation</th><th>Department</th><th>Grade</th><th>Family</th><th>Pending</th></tr></thead><tbody id="list"></tbody></table></div>
    <div class="card-body border-top d-flex align-items-center"><span class="text-muted small" id="count"></span>
      <div class="ms-auto btn-group" id="pager"></div></div>
  </div>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/seed.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/seed2.js"></script>
<script src="js/core/services.js"></script>
<script src="js/core/opd.js"></script>
<script src="js/core/vouchers.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/layout.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/pages/employees.js"></script>
</body>
</html>
