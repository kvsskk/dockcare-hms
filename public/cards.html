<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Issue · DockCare</title>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="page" hidden>
  <div class="row g-3">
    <div class="col-xl-5 no-print">
      <div class="card">
        <ul class="nav nav-tabs px-3 pt-2" id="tabs"></ul>
        <div class="card-body border-bottom py-2"><input class="form-control form-control-sm" id="filter" placeholder="Filter by name, employee code or Regn. No."></div>
        <div class="table-responsive" style="max-height:62vh"><table class="table table-hover table-sm"><thead><tr><th style="width:30px"><input class="form-check-input" type="checkbox" id="all" aria-label="Select all"></th><th>Beneficiary</th><th>Regn. No.</th><th>Printed</th></tr></thead><tbody id="list"></tbody></table></div>
        <div class="card-body border-top d-flex align-items-center gap-2"><span class="text-muted small" id="selCount">0 selected</span>
          <button class="btn btn-primary ms-auto" id="printBtn" disabled><i class="bi bi-printer me-1"></i>Print selected</button></div>
      </div>
    </div>
    <div class="col-xl-7">
      <div class="note note-info mb-2 no-print"><i class="bi bi-info-circle"></i><div>Prints at CR-80 card size (85.6 × 54 mm). Use the PVC card printer, or A4 paper for checking. Front and back print as separate cards.</div></div>
      <div class="card-preview-wrap" id="preview"><div class="empty"><i class="bi bi-person-vcard"></i>Select beneficiaries to preview their cards</div></div>
    </div>
  </div>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/seed.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/seed2.js"></script>
<script src="js/core/services.js"></script>
<script src="js/core/opd.js"></script>
<script src="js/core/vouchers.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/pages/cards.js"></script>
</body>
</html>
