  <div id="queueView">

      <div class="col-xl-8">

        </div>
      </div>
      <div class="col-xl-4">
        <div class="card"><div class="card-header"><h3>Seen today</h3></div><div class="table-responsive"><table class="table table-sm"><tbody id="seen"></tbody></table></div></div>
      </div>
    </div>
  </div>
  <div id="consultView" hidden></div>
</div>
