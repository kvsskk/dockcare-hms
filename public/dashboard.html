<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · DockCare</title>
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="page" hidden>
  <div class="row g-3 mb-3" id="kpis"></div>
  <div class="row g-3">
    <div class="col-xl-8">
      <div class="card mb-3">
        <div class="card-header"><h3>Quick actions</h3></div>
        <div class="card-body d-flex flex-wrap gap-2" id="actions"></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Recent activity</h3><span class="sub">From the audit log</span></div>
        <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Time</th><th>Action</th><th>Details</th><th>User</th></tr></thead><tbody id="activity"></tbody></table></div>
      </div>
    </div>
    <div class="col-xl-4">
      <div class="card mb-3">
        <div class="card-header"><h3>Beneficiaries by relation</h3></div>
        <div class="card-body" id="relations"></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Family size</h3><span class="sub">Members per employee</span></div>
        <div class="card-body" id="famsize"></div>
      </div>
    </div>
  </div>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/seed.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/seed2.js"></script>
<script src="js/core/services.js"></script>
<script src="js/core/opd.js"></script>
<script src="js/core/vouchers.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
