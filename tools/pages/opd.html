<div id="page" hidden>
  <div class="row g-3">
    <div class="col-xl-7">
      <div id="formCard">
        <div class="card mb-3">
          <div class="card-body">
            <form id="findForm" class="d-flex gap-2" role="search">
              <div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-qr-code-scan"></i></span>
                <input class="form-control form-control-lg" id="q" placeholder="Scan card or type employee code, name, Regn. No." autocomplete="off" autofocus></div>
              <button class="btn btn-primary px-4" type="submit">Find</button>
            </form>
          </div>
          <div id="family"></div>
        </div>
        <form class="card" id="visitForm" hidden novalidate>
          <div class="card-header"><h3>New OPD visit</h3><span class="ms-auto chip chip-teal" id="tokenHint"></span></div>
          <div class="card-body">
            <div id="benInfo" class="mb-3"></div>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label req" for="department">Department</label><select class="form-select" id="department" required></select></div>
              <div class="col-md-6"><label class="form-label req" for="doctor">Doctor</label><select class="form-select" id="doctor" required></select></div>
              <div class="col-md-6"><label class="form-label" for="visitType">Visit type</label><select class="form-select" id="visitType"><option value="fresh">Fresh visit</option><option value="follow_up">Follow-up</option><option value="emergency">Emergency</option></select></div>
              <div class="col-md-6"><label class="form-label" for="priority">Priority</label><select class="form-select" id="priority"><option value="normal">Normal</option><option value="urgent">Urgent</option><option value="emergency">Emergency</option></select></div>
              <div class="col-md-4"><label class="form-label" for="phone">Phone no.</label><input class="form-control" id="phone" inputmode="tel" maxlength="10" placeholder="10-digit mobile"></div>
              <div class="col-md-8"><label class="form-label" for="complaint">Chief complaint</label><input class="form-control" id="complaint" maxlength="150" placeholder="e.g. Fever and body pain since 2 days"></div>
            </div>
          </div>
          <div class="card-body border-top d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-light border" id="clearBtn">Clear</button>
            <button type="submit" class="btn btn-primary" id="registerBtn"><i class="bi bi-ticket-perforated me-1"></i>Register &amp; issue token</button>
          </div>
        </form>
      </div>
      <div class="card" id="tokenCard" hidden>
        <div class="card-body text-center py-5">
          <div class="text-muted">Token</div>
          <div id="tokenNo" style="font-size:72px;font-weight:800;line-height:1;color:var(--teal)"></div>
          <div class="mt-3 fs-5 fw-semibold" id="tokenWho"></div>
          <div class="text-muted" id="tokenWhere"></div>
          <div class="note note-info d-inline-flex mt-4 text-start"><i class="bi bi-info-circle"></i><div>Send the patient to the doctor. The <b>patient, doctor and lab vouchers</b> print when the doctor completes the consultation.</div></div>
          <div class="mt-4"><button class="btn btn-primary" id="newVisitBtn"><i class="bi bi-plus-lg me-1"></i>Next patient</button></div>
        </div>
      </div>
    </div>
    <div class="col-xl-5">
      <div class="card">
        <div class="card-header"><h3>Today's register</h3><span class="sub" id="regDate"></span><span class="ms-auto chip chip-teal" id="regCount"></span></div>
        <div class="table-responsive qtab"><table class="table table-hover table-sm"><thead><tr><th>Token</th><th>Patient</th><th>Doctor</th><th>Status</th><th></th></tr></thead><tbody id="register"></tbody></table></div>
      </div>
    </div>
  </div>
</div>
